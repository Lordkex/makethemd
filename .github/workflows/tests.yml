name: tests
on: [pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # packages/markitdown has no test suite of its own; the project tests live in tests/.
      # Heavy optional engines (torch/Whisper, PaddleOCR) are mocked by the tests.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flet==0.85.3 requests yt-dlp youtube-transcript-api==1.2.4 \
            Pillow pymupdf pdfplumber -e packages/markitdown
      - name: Run tests
        env:
          PYTHONPATH: tests:.
        run: python -m pytest tests -q
